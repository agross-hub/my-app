<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lindy Marketing Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1d4773;--navy-dk:#163859;--sky:#72bcdf;--sky-lt:#e3f3fb;
  --green:#5aad34;--green-lt:#eaf4e3;
  --bg:#f4f6f9;--surface:#fff;--border:#e2e6eb;--border-lt:#eef1f5;
  --text:#1a2030;--text2:#6b7280;--text3:#9ca3af;
  --r:10px;--r-sm:6px;
  --sh-md:0 4px 14px rgba(0,0,0,.08);
}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh}
.nav{background:var(--navy);position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(29,71,115,.3)}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 1.25rem;display:flex;align-items:center;height:54px;gap:2px}
/* nav-logo replaced with image */
#navLinks{display:flex;align-items:center;gap:2px;flex:1}
.nb{background:transparent;border:none;color:rgba(255,255,255,.68);font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background .14s,color .14s}
.nb:hover{background:rgba(255,255,255,.1);color:#fff}
.nb.active{background:rgba(255,255,255,.16);color:#fff;font-weight:500}
.nav-util{flex-shrink:0}
.burger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:#fff;margin-left:auto}
.mob-menu{display:none;background:var(--navy-dk);padding:8px 1.25rem 14px}
.mob-menu.open{display:block}
.mob-menu .nb{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:2px}
.app{max-width:1100px;margin:0 auto}
.page{display:none}.page.active{display:block}
.hero{background:var(--navy);padding:2rem 1.5rem;color:#fff}
.hero h1{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;margin-bottom:5px}
.hero h2{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;margin-bottom:4px}
.hero p{font-size:13px;color:rgba(255,255,255,.72)}
.pg-body{padding:1.5rem 1.25rem}
.sec-lbl{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.75rem}
.chip{font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:border-color .13s,background .13s}
.chip:hover{border-color:var(--sky);background:var(--sky-lt);color:var(--navy)}
.pg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px;margin-bottom:1.75rem}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;cursor:pointer;transition:box-shadow .14s,border-color .14s}
.pcard:hover{box-shadow:var(--sh-md);border-color:var(--sky)}
.pcard-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
.pcard h3{font-size:14px;font-weight:500;margin-bottom:4px}
.pcard p{font-size:12px;color:var(--text2);line-height:1.5}
.res-strip{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--sky);border-radius:0 var(--r) var(--r) 0;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:12px}
.res-strip h4{font-size:14px;font-weight:500}
.res-strip p{font-size:12px;color:var(--text2);margin-top:2px}
.sblock{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.sblock-hd{padding:.875rem 1.25rem;border-bottom:1px solid var(--border-lt);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sblock-ttl{font-size:14px;font-weight:500}
.sblock-note{font-size:12px;color:var(--text2);margin-top:2px}
.sblock-bd{padding:0 1.25rem}
.trow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-lt);gap:8px}
.trow:last-child{border-bottom:none}
.tinfo{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:1;min-width:0}
.tlbl{font-size:13px;color:var(--text)}
.topen{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--navy);background:var(--sky-lt);border:1px solid rgba(114,188,223,.3);border-radius:var(--r-sm);padding:5px 12px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .13s}
.topen:hover{background:#cde7f5}
.tsoon{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);background:#f5f6f8;border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 12px;white-space:nowrap;flex-shrink:0;cursor:default}
.bdg{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.bl{background:#ffecec;color:#7a1a1a}
.bs{background:#e8f5e9;color:#1b5e20}
.br{background:var(--sky-lt);color:var(--navy)}
.bso{background:#fff8e1;color:#6d4c00}
.bex{background:#f0ebfa;color:#4a2880}
.bfi{background:#f0f4f8;color:#374151}
.cs-wrap{background:var(--surface);border:1px dashed var(--border);border-radius:var(--r);padding:2.5rem 2rem;text-align:center}
.cs-wrap h3{font-size:16px;font-weight:500;margin:8px 0 6px}
.cs-wrap p{font-size:13px;color:var(--text2);line-height:1.6;max-width:380px;margin:0 auto 16px}
.cs-mods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.cs-mod{font-size:12px;padding:5px 12px;background:#f5f6f8;border:1px solid var(--border);border-radius:20px;color:var(--text2)}
.rsec{margin-bottom:1.25rem}
.rsec-ttl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:0 .25rem;margin-bottom:5px}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.ritem{display:flex;align-items:center;gap:10px;padding:10px 1.25rem;border-bottom:1px solid var(--border-lt);cursor:pointer;transition:background .12s;text-decoration:none}
.ritem:last-child{border-bottom:none}
.ritem:hover{background:#f7f9fc}
.rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rtext{flex:1}
.rlbl{font-size:13px;color:var(--text)}
.rdesc{font-size:11px;color:var(--text2);margin-top:1px}
.rarr{color:var(--text3);font-size:14px}
.cl-form{padding:0}
.cl-directions{background:var(--sky-lt);border-left:3px solid var(--navy);border-radius:0 8px 8px 0;padding:.875rem 1rem;margin-bottom:1.25rem;font-size:13px;color:var(--navy);line-height:1.6}
.cl-directions strong{display:block;margin-bottom:3px;font-size:13px}
.cl-header-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem}
.cl-field{display:flex;flex-direction:column;gap:4px}
.cl-field label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}
.cl-field input{font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);width:100%}
.cl-field input:focus{outline:none;border-color:var(--sky)}
.cl-sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.cl-sec-hd{background:var(--navy);padding:8px 14px}
.cl-sec-hd span{font-size:12px;font-weight:500;color:#fff;letter-spacing:.02em}
.cl-sec-bd{padding:10px 14px}
.cl-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--border-lt)}
.cl-item:last-of-type{border-bottom:none}
.cl-item input[type=checkbox]{margin-top:2px;accent-color:var(--navy);flex-shrink:0;cursor:pointer;width:14px;height:14px}
.cl-item-lbl{font-size:13px;color:var(--text);line-height:1.5;cursor:pointer}
.cl-notes{margin-top:10px}
.cl-notes label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);display:block;margin-bottom:4px}
.cl-notes textarea{font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);width:100%;min-height:60px;resize:vertical;color:var(--text);background:var(--surface)}
.cl-notes textarea:focus{outline:none;border-color:var(--sky)}
.cl-upload{margin-top:8px}
.cl-upload label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);display:block;margin-bottom:4px}
.cl-upload-btn{display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 12px;border:1px dashed var(--border);border-radius:var(--r-sm);cursor:pointer;color:var(--text2);background:var(--bg);transition:border-color .13s}
.cl-upload-btn:hover{border-color:var(--sky);color:var(--navy)}
.cl-upload input[type=file]{display:none}
.cl-previews{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cl-preview{position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.cl-preview img{width:100%;height:100%;object-fit:cover}
.cl-preview-rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);border:none;border-radius:50%;width:16px;height:16px;cursor:pointer;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;line-height:1}
.cl-submit{width:100%;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-top:6px;transition:background .14s}
.cl-submit:hover{background:var(--navy-dk)}
.cl-success{background:var(--green-lt);border:1px solid var(--green);border-radius:var(--r);padding:1rem 1.25rem;text-align:center}
.cl-success h3{font-size:15px;font-weight:500;color:var(--green);margin-bottom:4px}
.cl-success p{font-size:13px;color:var(--text2)}
.btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:8px 18px;border-radius:7px;cursor:pointer;border:none;transition:background .14s}
.btn-pri{background:var(--navy);color:#fff}.btn-pri:hover{background:var(--navy-dk)}
.btn-sec{background:var(--sky-lt);color:var(--navy);border:1px solid rgba(114,188,223,.4)}.btn-sec:hover{background:#cde7f5}
.btn-sm{font-size:12px;padding:5px 12px}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(15,25,45,.6);z-index:1000;align-items:center;justify-content:center;padding:1.5rem}
.modal-ov.open{display:flex}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:860px;height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.22);overflow:hidden}
.modal-hd{padding:.875rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:52px}
.modal-ttl{font-size:15px;font-weight:500}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;line-height:1;padding:2px 6px;border-radius:4px;font-family:sans-serif}.modal-close:hover{background:#f0f0f0}
.modal-bd{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.modal-bd iframe{width:100%;height:100%;border:none;display:block;flex:1}
.modal-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--surface);z-index:1}
.modal-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-loading p{font-size:13px;color:var(--text2)}
.modal-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;text-align:center;flex:1;gap:6px}
.modal-ph .ico{font-size:36px;margin-bottom:4px}
.modal-ph h3{font-size:16px;font-weight:500}
.modal-ph p{font-size:13px;color:var(--text2)}
.cl-wrap{padding:1.5rem;overflow-y:auto;height:100%}
.desc-row{padding:10px 0;font-size:13px;color:var(--text2);line-height:1.6}
@media(max-width:680px){
  #navLinks,.nav-util{display:none}
  .burger{display:block}
  .pg-grid{grid-template-columns:1fr 1fr}
  .modal{max-height:88vh}
  .modal-bd iframe{min-height:420px}
}
@media(max-width:420px){.pg-grid{grid-template-columns:1fr}}
</style>
</head>

    "blackout-guide": {
      title: "Adding blackouts on property calendars",
      intro: "Use this guide to block off dates and times when tours should not be scheduled. Important: blackouts cannot overlap. If one is already scheduled for that time, you will need to adjust the hours or you will get a warning and the blackout will not save.",
      steps: [
        {
          heading: "1. Go to the property dashboard",
          body: "Navigate to the dashboard of the community you would like to edit.",
        },
        {
          heading: "2. Click the property name",
          body: "Click on the property name in the upper left-hand corner of the dashboard.",
        },
        {
          heading: "3. Open CRM Settings",
          body: "From the menu that appears, navigate to CRM Settings.",
        },
        {
          heading: "4. Select Property Calendar",
          body: "Click on Property Calendar. Wait for the calendar to fully populate before continuing.",
        },
        {
          heading: "5. Click Blackout",
          body: "Once the calendar loads, click the Blackout button on the right-hand side of the blue Property Calendar bar.",
        },
        {
          heading: "6. Choose one-time or recurring",
          body: "Select One-Time for a single date or Recurring for a repeating schedule (such as weekly closures).",
        },
        {
          heading: "7. Set the date and time, then save",
          body: "Fill in the date and time for the blackout, then click Save. If the time overlaps with an existing blackout, you will see a warning and the entry will not save — adjust the hours and try again.",
        },
      ],
    },

    "email-blast-guide": {
      title: "How to send an email blast to residents",
      intro: "These steps cover sending a mass email through RentCafe Site Manager. For the original article with screenshots, visit: lindy.freshservice.com/support/solutions/articles/21000035259",
      steps: [
        {
          heading: "1. Log in to RentCafe Site Manager",
          body: "Go to sitemanager.rentcafe.com/sitemanager/login.aspx and log in with your credentials.",
        },
        {
          heading: "2. Select your property",
          body: "Click on the Property Name to select the property you want to send the email for.",
        },
        {
          heading: "3. Navigate to Email Management",
          body: "In the left side menu, click Marketing, then select Email Management.",
        },
        {
          heading: "4. Create a new email",
          body: "Click the + Create New Email button.",
        },
        {
          heading: "5. Select your recipients",
          body: "Choose who you want to email — residents, prospects, or a specific group — then click Continue.",
        },
        {
          heading: "6. Write your message",
          body: "Enter your email message in the body. A Token List is available if you need to insert dynamic fields (like resident name or unit number). Click Continue when done.",
        },
        {
          heading: "7. Add images (optional)",
          body: "To add an image, double-click the Photo icon in the toolbar. Go to the Upload tab, click Choose File, browse to your image, then click Send to Server. Set the width to 500px (recommended) and click OK.",
        },
        {
          heading: "8. Preview before sending",
          body: "Always preview the email before sending to check formatting and content.",
        },
        {
          heading: "9. Enter the subject line and send",
          body: "Enter your subject line and click Send Now.",
        },
        {
          heading: "10. Confirm on the Activity Page",
          body: "You will be taken back to the Activity Page where you can see all emails you have sent and their current status.",
        },
      ],
    },

    "social-post-guide": {
      title: "How to create a social post — step by step guide",
      intro: "Use this guide alongside the video walkthrough above. All steps reference the ResPage social software. Remember: post to Google Business Profile at least once a week.",
      steps: [
        {
          heading: "1. Access the dashboard (0:00)",
          body: "Log into the ResPage social software. Navigate to the dashboard and click on the Social tab.",
        },
        {
          heading: "2. Select the property (0:13)",
          body: "Choose the property you want to post for from the dropdown menu in the top right corner.",
        },
        {
          heading: "3. Choose post type (0:31)",
          body: "Select Creative Post or Social Post. For standard posts, choose Social Post.",
        },
        {
          heading: "4. Posting requirements (0:45)",
          body: "Post on Google Business Profile at least once a week. You can also post on Facebook or Instagram if your property is connected.",
        },
        {
          heading: "5. Add media to the post (1:02)",
          body: "Click Add Media. Choose to upload an image from your files or select one from the Image Library.",
        },
        {
          heading: "6. Insert your property website link (1:35)",
          body: "Add a call-to-action button with a link to the property homepage.",
        },
        {
          heading: "7. Generate an AI social post (2:01)",
          body: "Use the Generate AI Social Post feature to create post copy based on your selected media.",
        },
        {
          heading: "8. Edit the generated post (2:57)",

// Shared tutorial lookup so modal can find items by key
const T = {};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function badge(type){
  const map = { loom:['bl','Loom'], scribe:['bs','Scribe'], resource:['br','Resources'], explainer:['bex','Explainer'], file:['bfi','File'], walkthrough:['bs','Walkthrough'], msform:['br','Form'] };
  const [c,l] = map[type]||['br',type];
  return `<span class="bdg ${c}">${l}</span>`;
}

function tutRow(item, key){
  if(item.url !== undefined){ T[key] = item; }
  let btn;
  if(item.type==='resource'){
    btn = `<button class="topen" onclick="go('resources')">Go to Resources →</button>`;
  } else if(item.type==='checklist'){
    btn = `<button class="topen" onclick="openChecklist()">Open →</button>`;
  } else if(item.type==='msform'){
    if(item.url && item.url !== '#'){
      btn = `<button class="topen" data-k="${key}" onclick="openT(this)">Open form →</button>`;
      if(item.url !== undefined){ T[key] = item; }
    } else {
      btn = `<button class="tsoon">Coming soon</button>`;
    }
  } else if(item.type==='walkthrough'){
    btn = `<button class="topen" onclick="openWalkthrough('${item.key}')">Open →</button>`;
  } else if(item.type==='file' && item.url && item.url!=='#'){
    btn = `<a class="topen" href="${item.url}" target="_blank" rel="noopener" style="text-decoration:none">Open →</a>`;
  } else if(item.url){
    btn = `<button class="topen" data-k="${key}" onclick="openT(this)">Open →</button>`;
  } else {
    btn = `<button class="tsoon">Coming soon</button>`;
  }
  return `<div class="trow"><div class="tinfo"><span class="tlbl">${esc(item.label)}</span>${badge(item.type)}</div>${btn}</div>`;
}

function sBlock(sec, pageId, sIdx){
  const noteHtml = sec.note ? `<div class="sblock-note">${esc(sec.note)}</div>` : '';
  const hdrRight = sec.hasChecklist
    ? `<button class="btn btn-sec btn-sm" onclick="openChecklist()">Open checklist</button>` : '';
  let body;
  if(sec.hasChecklist){
    body = `<div class="desc-row">${sec.note ? esc(sec.note) : ''}</div>`;
  } else {
    body = (sec.items||[]).map((item,iIdx) => tutRow(item, `${pageId}-${sIdx}-${iIdx}`)).join('');
  }
  const noteInHdr = sec.hasChecklist ? '' : noteHtml;
  return `<div class="sblock">
    <div class="sblock-hd">
      <div><span class="sblock-ttl">${esc(sec.title)}</span>${noteInHdr}</div>
      ${hdrRight}
    </div>
    <div class="sblock-bd">${body}</div>
  </div>`;
}

function renderHome(){
  const {tagline,quickTasks,platforms} = CONTENT.home;
  const tasks = quickTasks.map(t=>`<span class="chip" onclick="go('${t.goTo}')">${esc(t.label)}</span>`).join('');
  const cards = platforms.map(p=>{
    const pg = CONTENT.pages[p.id];
    const soon = (pg&&pg.type==='comingSoon') ? ' <span class="bdg bso">Soon</span>' : '';
    return `<div class="pcard" onclick="go('${p.id}')"><div class="pcard-ico" style="background:${p.bg}">${p.icon}</div><h3>${esc(p.name)}${soon}</h3><p>${esc(p.desc)}</p></div>`;
  }).join('');
  return `<div class="hero"><h1>Marketing Hub</h1><p>${esc(tagline)}</p></div>
  <div class="pg-body">
    <p class="sec-lbl">Quick tasks</p>
    <div class="chips">${tasks}</div>
    <p class="sec-lbl">Platforms</p>
    <div class="pg-grid">${cards}</div>
    <div class="res-strip">

      <button class="btn btn-sec btn-sm" onclick="go('resources')">View →</button>

}

function renderPage(id, pg){

function renderResources(){

    const items = g.items.map(item=>{

        return `<div class="ritem" style="cursor:pointer" onclick="${item.action}">
          <span class="rdot" style="background:${dotMap[item.dot]||'var(--navy)'}"></span>
          <div class="rtext"><div class="rlbl">${esc(item.label)}</div>${item.desc?`<div class="rdesc">${esc(item.desc)}</div>`:''}</div>
          <span class="rarr">↗</span></div>`;
      }
      return `<a class="ritem" href="${esc(item.url||'#')}" target="_blank" rel="noopener">
        <span class="rdot" style="background:${dotMap[item.dot]||'var(--navy)'}"></span>
        <div class="rtext"><div class="rlbl">${esc(item.label)}</div>${item.desc?`<div class="rdesc">${esc(item.desc)}</div>`:''}</div>

  return `<div class="hero"><h2>Resources</h2><p>Reference materials and links. Tutorials live on each platform page.</p></div>

}

function renderTutorials(){
  const blocks = Object.entries(CONTENT.pages)
    .filter(([,p])=>p.type!=='comingSoon'&&p.sections)
    .map(([id,pg])=>{
      const rows = pg.sections.flatMap((s,si)=>
        (s.items||[]).filter(it=>it.type==='loom'||it.type==='scribe')
          .map((it,ii)=>tutRow(it,`${id}-${si}-${ii}`))
      ).join('');
      return rows ? `<div class="sblock">
        <div class="sblock-hd"><span class="sblock-ttl" style="color:var(--navy)">${esc(pg.title)}</span></div>
        <div class="sblock-bd">${rows}</div></div>` : '';
    }).join('');
  return `<div class="hero"><h2>All tutorials</h2><p>Every tutorial organized by platform. Use this if you're not sure where to look.</p></div>
  <div class="pg-body">${blocks}</div>`;
}

function renderChecklist(){
  const secs = CONTENT.checklist.map(function(sec, si){
    let itemsHtml = '';
    if(sec.groups){
      itemsHtml = sec.groups.map(function(grp, gi){
        const rows = grp.items.map(function(it, ii){
          const id = 'cl-'+si+'-g'+gi+'-'+ii;
          return '<div class="cl-item">'
            +'<input type="checkbox" id="'+id+'">'
            +'<label class="cl-item-lbl" for="'+id+'">'+esc(it)+'</label>'
            +'</div>';

          +rows
          +'</div>';
      }).join('');
    } else {
      itemsHtml = (sec.items||[]).map(function(it, ii){
        const id = 'cl-'+si+'-'+ii;
        return '<div class="cl-item">'
          +'<input type="checkbox" id="'+id+'">'
          +'<label class="cl-item-lbl" for="'+id+'">'+esc(it)+'</label>'
          +'</div>';
      }).join('');
    }
    const reqQ = sec.requiredQuestion
      ? '<div class="cl-notes" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-lt)">'
        +'<label style="color:var(--navy)">'+esc(sec.requiredQuestion)+' <span style="color:#c0392b">*</span></label>'
        +'<textarea data-required="true" placeholder="Required — please describe what you see..." style="min-height:80px"></textarea>'
        +'</div>'
      : '';
    return '<div class="cl-sec">'
      +'<div class="cl-sec-hd"><span>'+esc(sec.title)+'</span></div>'
      +'<div class="cl-sec-bd">'
      +itemsHtml
      +reqQ
      +'<div class="cl-notes"><label>Notes (optional)</label>'
      +'<textarea placeholder="Note any issues or corrections here..."></textarea></div>'
      +'<div class="cl-upload"><label>Screenshots (optional)</label>'
      +'<label class="cl-upload-btn"><input type="file" accept="image/*" multiple onchange="clAddPreviews(this)"> + Upload screenshots</label>'
      +'<div class="cl-previews"></div>'
      +'</div>'
      +'</div></div>';
  }).join('');

  return '<div class="cl-wrap" id="clWrap">'
    +'<div class="cl-directions">'
    +'<strong>Monthly Digital Accuracy Audit Form</strong>'
    +'This form must be completed once per month for each property. Check each item if accurate, upload a screenshot and note the correct information for anything that needs to be fixed. '
    +'Audits are due by the last day of each month. You will receive an automatic reminder with a link to this form at the start of each month. You can also find it anytime in the hub.'
    +'</div>'
    +'<div class="cl-header-grid">'
    +'<div class="cl-field"><label>Property name</label><input type="text" id="clProp" placeholder="e.g. Bromley House"></div>'
    +'<div class="cl-field"><label>Your name</label><input type="text" id="clName" placeholder="First and last name"></div>'
    +'<div class="cl-field"><label>Date completed</label><input type="date" id="clDate"></div>'
    +'<div class="cl-field"><label>Your email</label><input type="email" id="clEmail" placeholder="you@lindycommunities.com"></div>'
    +'</div>'
    +secs
    +'<button class="cl-submit" onclick="clSubmit()">Submit audit</button>'
    +'</div>';
}

  const links = CONTENT.nav.map(n=>`<button class="nb" data-p="${n.id}" onclick="go('${n.id}')">${esc(n.label)}</button>`).join('');

  renderNav();

// ── NAV ──
function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('active',b.dataset.p===id));
  const el=document.getElementById('pg-'+id);
  if(el){el.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
}
function toggleMob(){document.getElementById('mobMenu').classList.toggle('open');}
function closeMob(){document.getElementById('mobMenu').classList.remove('open');}

// ── MODAL ──
function openT(btn){
  const item=T[btn.dataset.k];
  if(!item)return;
  document.getElementById('modalTtl').textContent=item.label;
  const bd=document.getElementById('modalBd');
  const isJotform = item.url && item.url.includes('jotform.com');
  if(isJotform){
    const iframeId = 'JotFormIFrame-260946819364065';
    bd.innerHTML='<div class="modal-loading" id="mLoad"><div class="modal-spinner"></div><p>Loading form...</p></div>'
      +'<iframe id="'+iframeId+'" title="Lindy Communities Digital Audit"'
      +' allowtransparency="true"'
      +' allow="geolocation; microphone; camera; fullscreen; payment"'
      +' src="'+item.url+'"'
      +' frameborder="0"'
      +' style="opacity:0;min-width:100%;max-width:100%;width:100%;height:100%;border:none;display:block;flex:1"'
      +' scrolling="yes"></iframe>';
    const iframe = bd.querySelector('iframe');
    iframe.addEventListener('load', function(){
      iframe.style.opacity='1';
      const loader=document.getElementById('mLoad');
      if(loader)loader.remove();
      if(!document.getElementById('jf-embed-script')){
        const s=document.createElement('script');
        s.id='jf-embed-script';
        s.src='https://cdn.jotfor.ms/s/umd/latest/for-form-embed-handler.js';
        s.onload=function(){
          if(window.jotformEmbedHandler)
            window.jotformEmbedHandler("iframe[id='JotFormIFrame-260946819364065']","https://form.jotform.com/");
        };
        document.body.appendChild(s);
      } else if(window.jotformEmbedHandler){
        window.jotformEmbedHandler("iframe[id='JotFormIFrame-260946819364065']","https://form.jotform.com/");
      }
    });
  } else {
    bd.innerHTML='<div class="modal-loading" id="mLoad"><div class="modal-spinner"></div><p>Loading...</p></div>'
      +'<iframe src="'+item.url+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="opacity:0;position:absolute;inset:0;width:100%;height:100%;border:none"></iframe>';
    const iframe=bd.querySelector('iframe');
    iframe.addEventListener('load',function(){
      iframe.style.opacity='1';
      iframe.style.position='relative';
      const loader=document.getElementById('mLoad');
      if(loader)loader.remove();
    });
  }
  document.getElementById('modalOv').classList.add('open');
  document.body.style.overflow='hidden';
}
function openWalkthrough(key){
  const wt = CONTENT.walkthroughs && CONTENT.walkthroughs[key];
  if(!wt) return;
  document.getElementById('modalTtl').textContent = wt.title;
  const stepsHtml = wt.steps.map(function(s,i){
    const imgHtml = s.img
      ? '<img src="'+s.img+'" alt="'+esc(s.caption||'')+'" style="width:100%;border-radius:8px;border:1px solid var(--border);display:block;margin-bottom:6px">'
        + '<p style="font-size:11px;color:var(--text3);font-style:italic;margin-bottom:0">'+esc(s.caption||'')+'</p>'
      : '';
    return '<div style="margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border-lt)">'
      + '<h3 style="font-size:14px;font-weight:500;margin-bottom:6px;color:var(--text)">'+esc(s.heading)+'</h3>'
      + '<p style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:'+(imgHtml?'12px':'0')+'">'+esc(s.body)+'</p>'
      + imgHtml
      + '</div>';
  }).join('');
  const introHtml = wt.intro
    ? '<div style="background:var(--sky-lt);border-left:3px solid var(--sky);border-radius:0 8px 8px 0;padding:.875rem 1rem;margin-bottom:1.5rem;font-size:13px;color:var(--navy);line-height:1.6">'+esc(wt.intro)+'</div>'
    : '';
  document.getElementById('modalBd').innerHTML = '<div style="padding:1.25rem 1.5rem;overflow-y:auto;max-height:calc(90vh - 60px)">'+introHtml+stepsHtml+'</div>';
  document.getElementById('modalOv').classList.add('open');
  document.body.style.overflow='hidden';
}

function clAddPreviews(input){
  const wrap = input.closest('.cl-upload').querySelector('.cl-previews');
  Array.from(input.files).forEach(function(file){
    const reader = new FileReader();
    reader.onload = function(e){
      const div = document.createElement('div');
      div.className = 'cl-preview';
      div.innerHTML = '<img src="'+e.target.result+'"><button class="cl-preview-rm" onclick="this.parentNode.remove()" title="Remove">×</button>';
      wrap.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
  input.value='';
}

function clSubmit(){
  const prop = document.getElementById('clProp').value.trim();
  const name = document.getElementById('clName').value.trim();
  const date = document.getElementById('clDate').value;
  const email = document.getElementById('clEmail').value.trim();
  if(!prop||!name||!date||!email){
    alert('Please fill in all four header fields before submitting.');
    return;
  }
  // Validate required questions
  const reqFields = document.querySelectorAll('#clWrap textarea[data-required="true"]');
  let missing = false;
  reqFields.forEach(function(ta){ if(!ta.value.trim()){ ta.style.borderColor='#c0392b'; missing=true; } else { ta.style.borderColor=''; } });
  if(missing){ alert('Please answer all required questions (marked with *) before submitting.'); return; }
  // Build summary
  let body = 'MONTHLY DIGITAL ACCURACY AUDIT\n';
  body += 'Property: '+prop+'\n';
  body += 'Completed by: '+name+'\n';
  body += 'Date: '+date+'\n\n';
  const secs = document.querySelectorAll('#clWrap .cl-sec');
  secs.forEach(function(sec){
    const title = sec.querySelector('.cl-sec-hd span').textContent;
    body += '--- '+title+' ---\n';
    sec.querySelectorAll('.cl-item').forEach(function(row){
      const cb = row.querySelector('input[type=checkbox]');
      const lbl = row.querySelector('.cl-item-lbl');
      if(cb && lbl){
        const grpEl = row.closest('[style*="margin-bottom:10px"]');
        const grpName = grpEl ? grpEl.querySelector('[style*="color:var(--sky)"]') : null;
        const prefix = grpName ? grpName.textContent+' — ' : '';
        body += (cb.checked ? '[✓] ' : '[ ] ') + prefix + lbl.textContent + '\n';
      }
    });
    sec.querySelectorAll('textarea').forEach(function(ta){
      const val = ta.value.trim();
      if(val){
        const isReq = ta.dataset.required === 'true';
        const lbl = ta.closest('.cl-notes').querySelector('label');
        const labelTxt = lbl ? lbl.textContent.replace('*','').trim() : (isReq ? 'Required response' : 'Notes');
        body += labelTxt+': '+val+'\n';
      }
    });
    const imgs = sec.querySelectorAll('.cl-preview').length;
    if(imgs) body += imgs+' screenshot(s) attached\n';
    body += '\n';
  });
  const subject = encodeURIComponent('Monthly Digital Accuracy Audit — '+prop+' — '+date);
  const bodyEnc = encodeURIComponent(body);
  window.location.href = 'mailto:?subject='+subject+'&body='+bodyEnc;
  document.getElementById('clWrap').innerHTML = '<div class="cl-success">'
    +'<h3>Audit submitted</h3>'
    +'<p>Your email client has opened with a pre-filled summary. Send it to your Regional Manager and CC Marketing.</p>'
    +'<p style="margin-top:8px;font-size:12px;color:var(--text3)">You can close this window.</p>'
    +'</div>';
}
function openChecklist(){
  document.getElementById('modalTtl').textContent='Digital Audit Form';
  document.getElementById('modalBd').innerHTML=renderChecklist();
  document.getElementById('modalOv').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeM(){
  document.getElementById('modalOv').classList.remove('open');
  document.getElementById('modalBd').innerHTML='';
  document.body.style.overflow='';
}
function handleOvClick(e){if(e.target===document.getElementById('modalOv'))closeM();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});

renderAll();
</script>
